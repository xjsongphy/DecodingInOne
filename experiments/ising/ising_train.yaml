# Ising 训练实验配置
# 现在支持三类配置分离

# 数据生成配置
distance: 5
rounds: 5
basis: X
train_shots: 80000
val_shots: 20000

# 噪声参数
p_after_clifford: 0.001
p_before_round_data: 0.001
p_before_measure_flip: 0.001
p_after_reset_flip: 0.001

# 模型结构配置
input_channels: 4
out_channels: 4
num_filters: [64, 64, 64, 4]
kernel_sizes: [3, 3, 3, 3]
activation: gelu
dropout: 0.1

# 训练优化配置
batch_size: 1024
epochs: 10
lr: 0.001
weight_decay: 0.00001
device: auto
seed: 0
out_dir: experiments/ising/train_output
