# Ising-style training config aligned to Ising-Decoding public model_id=1.
# DecodingInOne now supports mixed-basis training when basis=both and rotation
# is set explicitly.

# Data generation
distance: 9
rounds: 9
basis: both
rotation: XV
train_shots: 2000000
val_shots: 65536
precomputed_frames_dir: D:/Develop/DecodingInOne/artifacts/ising_d9_r9_o1
allow_stim_dem_extraction: false

# 25-parameter circuit-level noise model, matching Ising-Decoding public defaults (p=0.003)
p_prep_X: 0.002
p_prep_Z: 0.002
p_meas_X: 0.002
p_meas_Z: 0.002
p_idle_cnot_X: 0.001
p_idle_cnot_Y: 0.001
p_idle_cnot_Z: 0.001
p_idle_spam_X: 0.001996
p_idle_spam_Y: 0.001996
p_idle_spam_Z: 0.001996
p_cnot_IX: 0.0002
p_cnot_IY: 0.0002
p_cnot_IZ: 0.0002
p_cnot_XI: 0.0002
p_cnot_XX: 0.0002
p_cnot_XY: 0.0002
p_cnot_XZ: 0.0002
p_cnot_YI: 0.0002
p_cnot_YX: 0.0002
p_cnot_YY: 0.0002
p_cnot_YZ: 0.0002
p_cnot_ZI: 0.0002
p_cnot_ZX: 0.0002
p_cnot_ZY: 0.0002
p_cnot_ZZ: 0.0002

# Sampling
enable_parallel: true
num_workers: 8
parallel_device_ids: null
sampling_chunk_size: 16384
save_samples: true

# Model architecture, matching public model_id=1
input_channels: 4
out_channels: 4
num_filters: [128, 128, 128, 4]
kernel_sizes: [3, 3, 3, 3]
activation: gelu
dropout: 0.05

# Training hyperparameters, matching public model_id=1
batch_size: 512
val_batch_size: 2048
epochs: 100
lr: 0.0003
weight_decay: 0.0000001
optimizer_type: Lion
beta2: 0.95
accumulate_steps: 2
lr_scheduler_type: warmup_then_decay
warmup_steps: 100
lr_milestones: [0.25, 0.5, 1.0]
lr_gamma: 0.7
min_lr: 0.000001
batch_schedule_enabled: true
batch_size_initial: 512
batch_size_final: 2048
batch_schedule_start_epoch: 0
batch_schedule_end_epoch: 0
device: auto
seed: 0
out_dir: outputs/ising
