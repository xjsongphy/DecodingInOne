[project]
name = "decoding-in-one"
version = "0.1.0"
description = "Modular quantum error correction decoding framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "stim>=1.9.0",
    "pymatching>=2.0.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
