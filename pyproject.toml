[project]
name = "decoding-in-one"
version = "0.1.0"
description = "Modular quantum error correction decoding framework"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "stim>=1.9.0",
    "pymatching>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
default = [
    "stim>=1.9.0",
    "pymatching>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
]

# CPU 版本 PyTorch
cpu = [
    "torch>=2.5,<2.8",
    "torchvision>=0.20,<0.23",
]

# CUDA 版本 PyTorch (需要使用 index-url)
# 安装命令: uv sync --extra cuda --index-url https://download.pytorch.org/whl/cu124
cuda = [
    "torch>=2.5,<2.8",
    "torchvision>=0.20,<0.23",
]

# 开发工具
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
