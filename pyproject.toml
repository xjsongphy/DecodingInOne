[project]
name = "decoding-in-one"
version = "0.1.0"
description = "Modular quantum error correction decoding framework"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "stim>=1.9.0",
    "pymatching>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.5,<2.8",
]
cu124 = [
    "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-win_amd64.whl",
]
cuda = [
    "decoding-in-one[cu124]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
default = [
    "stim>=1.9.0",
    "pymatching>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
]

cpu = [
    "torch>=2.5,<2.8",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
default-groups = ["default"]
